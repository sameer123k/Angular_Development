<div class="nav">
  <div>
  <input class="form-control" type="text" placeholder="Search User"
        (keyup)="searchFilter($event)">
  </div>

  

  <!-- name filter -->
  <div>
    <mat-form-field>
      <mat-label>Search by Name</mat-label>
      <mat-select (selectionChange)="namefilter($event.value)">
        <mat-option *ngFor="let data of nameData" >{{data}} </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- email filter -->
  <div>
    <mat-form-field>
      <mat-label>Search by Email</mat-label>
      <mat-select (selectionChange)="emailFilter($event.value)">
        <mat-option *ngFor="let email of emailData"> {{email}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- add form button -->
  <div>
    <button mat-raised-button color="accent" data-bs-toggle="modal" data-bs-target="#exampleModal">Add</button>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">

      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Add Employee</h1>
        </div>
        <div class="modal-body">
          <form [formGroup]="signUPData" (submit)="saveData()">
            <div class="row">

              <div class="col">
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input type="text" id="name" class="form-control" formControlName="name" placeholder="Enter Name">
                </div>
              </div>

              <div class="col">
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter Email">
                </div>
              </div>

            </div>
            <div class="row">

              <div class="col">
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" id="password" formControlName="password" class="form-control" placeholder="Enter Password" maxlength="6">
                </div>
              </div>

              <div class="col">
                <div class="mb-3">
                  <label for="age" class="form-label">Age</label>
                  <input type="text" id="age" formControlName="age" class="form-control" placeholder="Enter Age" maxlength="3">
                </div>
              </div>


            </div>
            <div class="row">

              <div class="col">
                <div class="mb-3">
                  <label for="contact" class="form-label">Contact</label>
                  <input type="tel" id="contact" formControlName="contact" class="form-control" placeholder="Enter Contact" maxlength="10">
                </div>
              </div>


            </div>
            <div class="row">
              <div class="btn-div">
                <button mat-raised-button color="primary" [disabled]="signUPData.invalid" type="submit" data-bs-dismiss="modal" aria-label="Close">Submit</button>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="inner">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="password">
        <th mat-header-cell *matHeaderCellDef> Password </th>
        <td mat-cell *matCellDef="let element"> {{element.password}} </td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="dob">
        <th mat-header-cell *matHeaderCellDef> Dob </th>
        <td mat-cell *matCellDef="let element"> {{element.age}} </td>
      </ng-container>
      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef> Contact </th>
        <td mat-cell *matCellDef="let element"> {{element.contact}} </td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef> Action </th>
        <td mat-cell *matCellDef="let element">
          <button mat-button color="primary" data-bs-target="#exampleModal" data-bs-toggle="modal"
            *ngIf="element.clientEdit" (click)="editData(element._id)" >Edit</button>
          <button mat-button color="warn" (click)="deleteUser(element._id)" >Delete</button>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
